version: "3.8"

services:
  # (Optional fallback Flask; not exposed publicly)
  user-reg:
    build:
      context: ./flask-user-reg
      dockerfile: Dockerfile
    environment:
      - SOCKETIO_URL=http://app:5000
      - INTERNAL_SOCKET_SECRET=${INTERNAL_SOCKET_SECRET}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - FLASK_ENV=production
      - FLASK_APP=app.py
    depends_on:
      app:
        condition: service_started
    networks: [app-network]
    restart: unless-stopped

  # Frontend: built and served by Nginx (see Dockerfile.prod)
  frontend:
    build:
      context: ./frontend
    # Ensure your ./frontend/Dockerfile.prod exists (see note below)
      dockerfile: Dockerfile.prod
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks: [app-network]
    restart: unless-stopped

  # Backend: Node/Express API + Socket.IO
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - MQTT_URL=${MQTT_URL}                    # mqtt://mosquitto:1883
      - INTERNAL_SOCKET_SECRET=${INTERNAL_SOCKET_SECRET}
    ports:
      - "5000:5000"
    expose:
      - "5000"                                  # internal only; Caddy reverse-proxies
    depends_on:
      mosquitto:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [app-network]
    restart: unless-stopped

  # Mosquitto broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    # PUBLIC RAW MQTT as requested:
    ports:
      - "1883:1883"
    # WebSockets (9001) kept internal; Caddy fronts it with TLS
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks: [app-network]
    restart: unless-stopped

  # MongoDB
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    command: ["--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [app-network]
    restart: unless-stopped

  # Redis
  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    networks: [app-network]
    restart: unless-stopped

  # Caddy: the only public entry point (HTTP/HTTPS + WSS frontage for MQTT)
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - frontend
      - mosquitto
    networks: [app-network]
    restart: unless-stopped

volumes:
  mongo-data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
