# ---------- Listeners ----------
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ---------- Auth (dev only) ----------
# Remove in prod (or add password_file / auth plugin)
allow_anonymous true

# ---------- Persistence ----------
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 10              # write mosquitto.db every 10s
# autosave_on_changes true        # (optional) write immediately on changes

# ---------- Queues / Sessions ----------
# Don’t drop queued QoS1/2 for persistent clients
max_queued_messages 0             # 0 = unlimited
max_queued_bytes 0                # 0 = unlimited
queue_qos0_messages false         # don’t persist QoS0 for offline clients
# Tidy up abandoned sessions (optional)
# persistent_client_expiration 7d

# ---------- Logging ----------
# In containers, stdout is best:
log_dest stdout
# Or, if you prefer file logs (you mounted /mosquitto/log):
# log_dest file /mosquitto/log/mosquitto.log
